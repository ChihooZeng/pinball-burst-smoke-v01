<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#091222"/>
  <title>弹球暴走 · 手机试玩原型</title>
  <link rel="stylesheet" href="./style.css"/>
</head>
<body>
  <main class="page">
    <header class="heading">
      <div class="eyebrow">PINBALL BURST / PROTOTYPE 0.1</div>
      <h1>弹球暴走 <span>试玩原型</span></h1>
      <p>一颗球、几块砖，先验证手机操作与网页部署。</p>
    </header>
    <section class="hud" aria-label="游戏统计">
      <span>已击碎 <strong id="score">0</strong><small> / 15</small></span>
      <span id="stateText" role="status" aria-live="polite">拖动瞄准，松开发射</span>
    </section>
    <div class="game-wrap">
      <canvas id="game" width="360" height="560" aria-label="弹球打砖块游戏。拖动瞄准并松开发射。"></canvas>
      <div class="overlay hidden" id="overlay">
        <div class="win-caption">CLEAR!</div>
        <h2>全部击碎</h2>
        <p>你的第一局已经完成。</p>
        <button id="again" type="button">再来一局</button>
      </div>
    </div>
    <nav class="controls" aria-label="游戏操作">
      <button id="fire" type="button">发射弹珠</button>
      <button id="reset" class="secondary" type="button">重开</button>
    </nav>
    <p class="tip">在游戏画面里按住并拖动，可预览弹道；松手发射。球回到底部后可再次发射。也可直接点「发射弹珠」。</p>
    <footer>v0.1 · 仅验证触控、反弹、击砖与公网试玩；暂无增殖、强化和大招。</footer>
  </main>
  <script src="./game.js" defer></script>
</body>
</html>
